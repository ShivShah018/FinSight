name: FinSight CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

  backend-and-ml:
    name: Backend Tests & ML Validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: finsight_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/ml/requirements.txt

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/ml/requirements.txt

      - name: Install Backend Node Dependencies
        run: |
          cd server
          npm ci

      - name: Initialize Test Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot finsight_test < server/database/schema.sql

      - name: Run Backend Test Suite
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: finsight_test
          FINSIGHT_DB_HOST: 127.0.0.1
          FINSIGHT_DB_PORT: 3306
          FINSIGHT_DB_USER: root
          FINSIGHT_DB_PASSWORD: root
          FINSIGHT_DB_NAME: finsight_test
          JWT_SECRET_KEY: test_ci_jwt_secret_finsight_development_only_12345
          NODE_ENV: test
          ML_PYTHON_PATH: python
        run: |
          cd server
          npm test

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        run: |
          cd server
          npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --audit-level=high || true
